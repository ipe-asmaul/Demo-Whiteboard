<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inkboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--ui:#fbfaf8;--ink:#1d1c1a;--mute:#6f6b63;--line:#dcd8cf;--acc:#3a3fd8;--accbg:#e3e4fb;--sh:0 6px 24px rgba(20,18,10,.16);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ui:#26252a;--ink:#f2f0ec;--mute:#a09cab;--line:#3c3a44;--acc:#9aa0ff;--accbg:#33345a;--sh:0 6px 24px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--ui:#26252a;--ink:#f2f0ec;--mute:#a09cab;--line:#3c3a44;--acc:#9aa0ff;--accbg:#33345a;--sh:0 6px 24px rgba(0,0,0,.5);color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;position:relative;overflow:hidden;background:var(--ui);color:var(--ink);font:14px/1.3 "Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#stage{position:absolute;inset:0;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#cvT{cursor:crosshair}
#hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;pointer-events:none;z-index:5}
.bar{pointer-events:auto;display:flex;align-items:center;gap:2px;background:var(--ui);border:1px solid var(--line);border-radius:16px;padding:5px;box-shadow:var(--sh);max-width:100%;overflow-x:auto;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.b{flex:none;width:38px;height:38px;border:0;background:transparent;color:var(--ink);border-radius:10px;display:grid;place-items:center;cursor:pointer;font:inherit}
.b:hover{background:var(--accbg)}
.b[aria-pressed=true]{background:var(--accbg);color:var(--acc)}
.b:disabled{opacity:.35;cursor:default}
.b:focus-visible,.chip:focus-visible,.sw:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.b svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb{width:auto;padding:0 11px;font-weight:600;font-size:13px}
.sep{flex:none;width:1px;height:24px;background:var(--line);margin:0 5px}
#style{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 20px);box-sizing:border-box;z-index:5;gap:6px;padding:6px 10px;flex-wrap:wrap;justify-content:center;overflow:visible}
.sw{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--ui);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0;position:relative;overflow:hidden}
.sw[aria-pressed=true]{box-shadow:0 0 0 2.5px var(--acc)}
.sw input{position:absolute;inset:-6px;width:40px;height:40px;opacity:0;cursor:pointer}
.chip{flex:none;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:9px;padding:6px 10px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accbg);color:var(--acc);border-color:var(--acc)}
input[type=range]{width:90px;accent-color:var(--acc)}
#dot{flex:none;width:30px;display:grid;place-items:center}
#dot i{display:block;border-radius:50%;background:var(--ink)}
#bp{position:absolute;bottom:112px;right:10px;z-index:6;display:none;flex-direction:column;flex-wrap:nowrap;gap:10px;padding:12px;width:min(310px,calc(100% - 20px));box-sizing:border-box;background:var(--ui);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);max-height:calc(100% - 200px);overflow:auto}
#tools{position:absolute;left:10px;top:64px;z-index:5;flex-direction:column;max-height:calc(100% - 190px);overflow-y:auto;overflow-x:hidden}
#tools .sep{width:24px;height:1px;margin:4px 0}
.pop{position:absolute;display:none;z-index:6;padding:6px;flex-wrap:wrap}
.pop.open{display:flex}
#shp{left:64px;width:92px}
#sym{left:64px;top:64px;width:232px}
#sym .b{width:36px;height:36px;font-size:18px}
#bp h4{margin:2px 0 -2px;font-size:12px;color:var(--mute);font-weight:600}
#bp label{display:flex;align-items:center;gap:8px;justify-content:space-between}
#bp.open{display:flex}
#bp .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#ti{position:absolute;display:none;z-index:4;margin:0;padding:0;border:0;border-bottom:1.5px dashed var(--acc);outline:0;background:transparent;resize:none;line-height:1.25;overflow:hidden;min-width:80px;width:260px;height:auto;font-family:"Segoe Print","Bradley Hand","Chalkboard SE",system-ui,sans-serif;user-select:text;-webkit-user-select:text}
#hint{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;text-align:center;padding:24px;font-size:16px}
#toast{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--ui);border-radius:20px;padding:6px 14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:7}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style></head>
<body>
<div id="stage"><canvas id="cv"></canvas><canvas id="cvT"></canvas><textarea id="ti" rows="1" aria-label="Text"></textarea><div id="hint"></div></div>
<div class="bar" id="tools" role="toolbar" aria-label="Tools"></div><div class="bar pop" id="shp"></div><div class="bar pop" id="sym"></div>
<div id="hud">
  <div class="bar" id="acts">
    <button class="b" id="undo" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5M4 12h11a5 5 0 010 10h-3"/></svg></button>
    <button class="b" id="redo" title="Redo (Ctrl+Y)" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="M15 7l5 5-5 5M20 12H9a5 5 0 000 10h3"/></svg></button>
    <button class="b" id="clear" title="Clear board" aria-label="Clear board"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg></button>
    <span class="sep"></span>
    <button class="b" id="zo" title="Zoom out" aria-label="Zoom out"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
    <button class="b tb" id="zl" title="Fit content" aria-label="Fit content">100%</button>
    <button class="b" id="zi" title="Zoom in" aria-label="Zoom in"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg></button>
    <span class="sep"></span>
    <button class="b tb" id="pdf" title="Export as PDF">PDF</button>
    <button class="b tb" id="png" title="Export as PNG">PNG</button>
  </div>
</div>
<div id="bp" class="pop" role="dialog" aria-label="Settings">
  <h4>Board</h4><div class="row" id="bcols"></div><div class="row" id="bpat"></div>
  <h4>Pen feel</h4><label>Smoothing <input type="range" id="sm" min="0" max="100"></label><div class="row" id="dynC"></div>
  <h4>Eraser</h4><div class="row" id="erC"></div><label>Size <input type="range" id="er" min="6" max="60"></label>
  <h4>Laser pen</h4><label>Fades after <input type="range" id="fd" min="1" max="10"><span id="fdv"></span></label>
  <h4>Text</h4><div class="row" id="fontC"></div><label>Size <input type="range" id="fz" min="12" max="96"></label>
</div>
<div class="bar" id="style">
  <div class="bar" id="cols" style="border:0;box-shadow:none;padding:0;gap:6px;overflow:visible"></div>
  <span class="sep"></span>
  <span id="dot"><i></i></span>
  <input type="range" id="sz" min="1" max="40" value="4" aria-label="Stroke size">
  <span class="sep"></span>
  <label style="display:flex;align-items:center;gap:6px;color:var(--mute)">Opacity <input type="range" id="op" min="10" max="100"></label>
  <button class="chip" id="dash" title="Line style for shapes">Solid</button>
  <button class="chip" id="fill" aria-pressed="false" title="Fill closed shapes">Fill</button>
  <span class="sep"></span>
  <button class="chip" id="smart" aria-pressed="true" title="Snap pen strokes into perfect lines, circles and boxes">Smart</button>
  <button class="chip" id="bd" aria-pressed="false">Settings</button>
</div>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),cv=$('#cv'),ctx=cv.getContext('2d'),cvT=$('#cvT'),tc=cvT.getContext('2d',{desynchronized:true}),ti=$('#ti');
const FONT='"Segoe Print","Bradley Hand","Chalkboard SE",system-ui,sans-serif';
const FF={hand:FONT,sans:'system-ui,"Segoe UI",sans-serif',serif:'Georgia,"Times New Roman",serif',math:'"Cambria Math","STIX Two Math","Latin Modern Math",Cambria,serif',mono:'ui-monospace,Menlo,Consolas,monospace'};
const S={tool:'pen',color:'#1d1c1a',size:4,smart:'r',bg:'#fbfaf6',grid:'dots',s:1,ox:0,oy:0,a:1,fill:false,dash:'s',sm:.6,dyn:'pressure',font:'hand',fs:28,er:14,erm:'p',fade:3};let holdT;
let objs=[],undo=[],redo=[],cur=null,W=0,H=0,dpr=1,raf=0,bd=false,td=false,space=false,mode=null,pan0=null,pinch=null,tx=null,sx=0,sy=0,lastp=null;
const P=new Map(),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lum=h=>{const n=parseInt(h.slice(1),16);return(.299*(n>>16)+.587*((n>>8)&255)+.114*(n&255))/255};
/* ---------- persistence ---------- */
try{const d=JSON.parse(localStorage.getItem('inkboard1')||'null');if(d){objs=d.objs||[];Object.assign(S,d.S||{})}}catch(e){}
if(typeof S.smart!=='string')S.smart=S.smart?'r':'o';S.stamp=null;
let st;function save(){clearTimeout(st);st=setTimeout(()=>{try{localStorage.setItem('inkboard1',JSON.stringify({objs:objs.map(o=>{const{b,...r}=o;return r}),S}))}catch(e){}},400)}
/* ---------- geometry ---------- */
function arrowHead(a,b,w){const g=Math.atan2(b[1]-a[1],b[0]-a[0]),h=Math.max(12,w*4);return[[b[0]+Math.cos(g+Math.PI-.45)*h,b[1]+Math.sin(g+Math.PI-.45)*h],b,[b[0]+Math.cos(g+Math.PI+.45)*h,b[1]+Math.sin(g+Math.PI+.45)*h]]}
function geom(o){
  const{x1,y1,x2,y2}=o,l=Math.min(x1,x2),r=Math.max(x1,x2),t=Math.min(y1,y2),b=Math.max(y1,y2),cx=(l+r)/2,cy=(t+b)/2;
  switch(o.t){
    case'line':return[[[x1,y1],[x2,y2]]];
    case'arrow':return[[[x1,y1],[x2,y2]],arrowHead([x1,y1],[x2,y2],o.w)];
    case'darrow':return[[[x1,y1],[x2,y2]],arrowHead([x1,y1],[x2,y2],o.w),arrowHead([x2,y2],[x1,y1],o.w)];
    case'rect':return[[[l,t],[r,t],[r,b],[l,b],[l,t]]];
    case'tri':return[[[cx,t],[r,b],[l,b],[cx,t]]];
    case'diamond':return[[[cx,t],[r,cy],[cx,b],[l,cy],[cx,t]]];
    case'ellipse':{const p=[];for(let i=0;i<=96;i++){const a=i/96*Math.PI*2;p.push([cx+Math.cos(a)*(r-l)/2,cy+Math.sin(a)*(b-t)/2])}return[p]}
    case'star':{const p=[];for(let i=0;i<=10;i++){const a=-Math.PI/2+i*Math.PI/5,k=i%2?.42:1;p.push([cx+Math.cos(a)*k*(r-l)/2,cy+Math.sin(a)*k*(b-t)/2])}return[p]}
    case'poly':case'pen':case'hl':return[o.pts];
  }return[]}
function bnd(o){if(o.b)return o.b;let a=1e9,c=1e9,d=-1e9,e=-1e9;
  if(o.t==='text'){const ls=o.s.split('\n');a=o.x;c=o.y;d=a+Math.max(...ls.map(l=>l.length))*o.fs*.62;e=c+ls.length*o.fs*1.25}
  else{for(const pl of geom(o))for(const p of pl){a=Math.min(a,p[0]);d=Math.max(d,p[0]);c=Math.min(c,p[1]);e=Math.max(e,p[1])}const m=o.w/2+1;a-=m;c-=m;d+=m;e+=m}
  return o.b=[a,c,d,e]}
function ds(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;if(!l)return Math.hypot(p[0]-a[0],p[1]-a[1]);const t=clamp(((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l,0,1);return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy)}
function hit(o,x,y,r){const b=bnd(o);if(x<b[0]-r||x>b[2]+r||y<b[1]-r||y>b[3]+r)return false;if(o.t==='text')return true;
  for(const pl of geom(o)){if(pl.length===1&&Math.hypot(pl[0][0]-x,pl[0][1]-y)<r+o.w)return true;for(let i=1;i<pl.length;i++)if(ds([x,y],pl[i-1],pl[i])<r+o.w/2)return true}return false}
/* ---------- drawing ---------- */
function drawObj(c,o){
  c.save();c.lineCap=c.lineJoin='round';c.strokeStyle=c.fillStyle=o.c;
  if(o.t==='text'){c.font=o.fs+'px '+(FF[o.f]||FONT);c.textBaseline='top';o.s.split('\n').forEach((l,i)=>c.fillText(l,o.x,o.y+i*o.fs*1.25));c.restore();return}
  c.lineWidth=o.w;c.globalAlpha=(o.a??1)*(o.t==='hl'?.38:1);if(o.dash&&o.dash!=='s'&&!o.pts)c.setLineDash(o.dash==='d'?[o.w*3,o.w*2.2]:[.1,o.w*2.2]);
  if(o.pts&&o.t!=='poly'){const p=o.pts;
    if(p.length===1){c.beginPath();c.arc(p[0][0],p[0][1],o.w/2,0,7);c.fill()}
    else if(o.vp&&o.t==='pen'){let m=p[0];for(let i=1;i<p.length;i++){const n=i<p.length-1?[(p[i][0]+p[i+1][0])/2,(p[i][1]+p[i+1][1])/2]:p[i];c.lineWidth=o.w*(.35+1.3*p[i][2]);c.beginPath();c.moveTo(m[0],m[1]);c.quadraticCurveTo(p[i][0],p[i][1],n[0],n[1]);c.stroke();m=n}}
    else{c.beginPath();c.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length-1;i++)c.quadraticCurveTo(p[i][0],p[i][1],(p[i][0]+p[i+1][0])/2,(p[i][1]+p[i+1][1])/2);const e=p[p.length-1];c.lineTo(e[0],e[1]);c.stroke()}
  }else for(const pl of geom(o)){c.beginPath();pl.forEach((q,i)=>i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]));if(o.fill&&o.t!=='line'&&o.t.indexOf('arrow')<0){c.save();c.globalAlpha*=.22;c.fill();c.restore()}c.stroke()}
  c.restore()}
function bg(c,x0,y0,x1,y1,sc){c.fillStyle=S.bg;c.fillRect(x0,y0,x1-x0,y1-y0);if(S.grid==='none')return;const g=28;if(g*sc<8)return;
  c.fillStyle=c.strokeStyle=lum(S.bg)>.5?'rgba(0,0,0,.17)':'rgba(255,255,255,.2)';c.lineWidth=1/sc;
  const gx=Math.floor(x0/g)*g,gy=Math.floor(y0/g)*g;
  if(S.grid==='dots'){const d=1.6/sc;for(let x=gx;x<x1;x+=g)for(let y=gy;y<y1;y+=g)c.fillRect(x-d/2,y-d/2,d,d)}
  else{c.beginPath();if(S.grid==='grid')for(let x=gx;x<x1;x+=g){c.moveTo(x,y0);c.lineTo(x,y1)}for(let y=gy;y<y1;y+=g){c.moveTo(x0,y);c.lineTo(x1,y)}c.stroke()}}
const setT=c=>c.setTransform(dpr*S.s,0,0,dpr*S.s,dpr*S.ox,dpr*S.oy);
function render(){setT(ctx);const x0=-S.ox/S.s,y0=-S.oy/S.s,x1=x0+W/S.s,y1=y0+H/S.s;bg(ctx,x0,y0,x1,y1,S.s);
  for(const o of objs){const b=bnd(o);if(b[2]<x0||b[0]>x1||b[3]<y0||b[1]>y1)continue;drawObj(ctx,o)}
  $('#hint').style.display=objs.length?'none':'grid'}
function topDraw(){tc.setTransform(1,0,0,1,0,0);tc.clearRect(0,0,cvT.width,cvT.height);setT(tc);
  if(S.tool==='eraser'&&hov){tc.beginPath();tc.arc(hov[0],hov[1],er(),0,7);tc.lineWidth=1.5/S.s;tc.strokeStyle=lum(S.bg)>.5?'#555':'#ccc';tc.stroke()}
  if(cur)drawObj(tc,cur);
  if(sel.size){let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const o of sel){const q=bnd(o);a=Math.min(a,q[0]);b=Math.min(b,q[1]);c=Math.max(c,q[2]);d=Math.max(d,q[3])}const k=1/S.s;tc.save();tc.strokeStyle='#3a6bff';tc.lineWidth=1.5*k;tc.setLineDash([6*k,4*k]);tc.strokeRect(a-4*k,b-4*k,c-a+8*k,d-b+8*k);tc.restore()}
  if(marq){const k=1/S.s;tc.save();tc.fillStyle='rgba(58,107,255,.1)';tc.strokeStyle='#3a6bff';tc.lineWidth=1.5*k;tc.setLineDash([5*k,4*k]);tc.fillRect(marq[0],marq[1],marq[2]-marq[0],marq[3]-marq[1]);tc.strokeRect(marq[0],marq[1],marq[2]-marq[0],marq[3]-marq[1]);tc.restore()}
  if(lasers.length){const now=performance.now(),fd=S.fade*1000;lasers=lasers.filter(l=>{l.pts=l.pts.filter(p=>now-p[2]<fd);return l.pts.length});
    for(const l of lasers){tc.save();tc.lineCap=tc.lineJoin='round';tc.strokeStyle=tc.fillStyle=l.c;tc.shadowColor=l.c;tc.shadowBlur=12;tc.lineWidth=l.w;
      for(let i=1;i<l.pts.length;i++){const a=l.pts[i-1],b=l.pts[i];tc.globalAlpha=Math.max(0,1-(now-b[2])/fd);tc.beginPath();tc.moveTo(a[0],a[1]);tc.lineTo(b[0],b[1]);tc.stroke()}
      const e=l.pts[l.pts.length-1];tc.globalAlpha=Math.max(0,1-(now-e[2])/fd);tc.beginPath();tc.arc(e[0],e[1],l.w*.8,0,7);tc.fill();tc.restore()}
    if(lasers.length)inv(false,true)}}
function inv(b,t){bd=bd||b;td=td||t;if(!raf)raf=requestAnimationFrame(()=>{raf=0;if(bd){render();bd=false}if(td){topDraw();td=false}})}
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);const r=$('#stage').getBoundingClientRect();W=r.width;H=r.height;for(const c of[cv,cvT]){c.width=W*dpr;c.height=H*dpr}inv(true,true)}
/* ---------- history ---------- */
function pushUndo(){undo.push(objs.slice());if(undo.length>100)undo.shift();redo=[];btns()}
function btns(){$('#undo').disabled=!undo.length;$('#redo').disabled=!redo.length}
function commit(o){pushUndo();objs.push(o);setT(ctx);drawObj(ctx,o);cur=null;$('#hint').style.display='none';inv(false,true);save()}
$('#undo').onclick=()=>{if(!undo.length)return;redo.push(objs);objs=undo.pop();btns();inv(true,false);save()};
$('#redo').onclick=()=>{if(!redo.length)return;undo.push(objs);objs=redo.pop();btns();inv(true,false);save()};
$('#clear').onclick=()=>{if(!objs.length)return;pushUndo();objs=[];inv(true,false);save();toast('Board cleared — undo to restore')};
/* ---------- smart shapes ---------- */
function rdp(p,e){if(p.length<3)return p;let m=0,k=0;const a=p[0],b=p[p.length-1];for(let i=1;i<p.length-1;i++){const d=ds(p[i],a,b);if(d>m){m=d;k=i}}if(m>e){const l=rdp(p.slice(0,k+1),e),r=rdp(p.slice(k),e);return l.slice(0,-1).concat(r)}return[a,b]}
function recog(p){
  if(p.length<6)return null;let L=0,x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(let i=0;i<p.length;i++){if(i)L+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);x0=Math.min(x0,p[i][0]);x1=Math.max(x1,p[i][0]);y0=Math.min(y0,p[i][1]);y1=Math.max(y1,p[i][1])}
  const bw=x1-x0,bh=y1-y0,dg=Math.hypot(bw,bh);if(L<40/S.s||dg*S.s<36)return null;
  const a=p[0],z=p[p.length-1],gap=Math.hypot(a[0]-z[0],a[1]-z[1]);
  if(gap>.22*L){let m=0;for(const q of p)m=Math.max(m,ds(q,a,z));
    if(gap>.85*L&&m<.06*gap){let[X,Y]=z;const an=Math.atan2(Y-a[1],X-a[0])*180/Math.PI,r=v=>Math.abs(((v%90)+90)%90);
      if(Math.abs(Math.abs(an)-90)<4)X=a[0];else if(Math.min(Math.abs(an),180-Math.abs(an))<4)Y=a[1];

mk('select','Select & move','v',b=>tbtn.pen.before(b));tbtn.select.after(Object.assign(document.createElement('span'),{className:'sep'}));
mk('laser','Laser pen (fades)','k',b=>tbtn.eraser.after(b));
const selbar=document.createElement('div');selbar.className='bar';selbar.style.cssText='display:none;position:absolute;top:64px;left:50%;transform:translateX(-50%);z-index:5;gap:4px';
selbar.innerHTML='<button class="chip" id="sdup">Duplicate</button><button class="chip" id="sdel">Delete</button>';document.body.append(selbar);
const cl=o=>({...o,pts:o.pts&&o.pts.map(p=>p.slice()),b:null});
function shift(o,dx,dy){if(o.pts)for(const p of o.pts){p[0]+=dx;p[1]+=dy}else if(o.t==='text'){o.x+=dx;o.y+=dy}else{o.x1+=dx;o.x2+=dx;o.y1+=dy;o.y2+=dy}o.b=null}
function selUI(){selbar.style.display=sel.size?'flex':'none'}
function clearSel(){if(sel.size){sel.clear();selUI();inv(false,true)}}
function selDown(x,y){const r=8/S.s;let h=null;for(let i=objs.length-1;i>=0;i--)if(hit(objs[i],x,y,r)){h=objs[i];break}
  if(h){if(!sel.has(h)){sel.clear();sel.add(h)}mode='move';mv={x,y,c:false}}else{sel.clear();mode='marq';marq=[x,y,x,y]}selUI();inv(false,true)}
function selMove(x,y){if(mode==='marq'){marq[2]=x;marq[3]=y;inv(false,true);return}
  if(!mv.c){pushUndo();const m=[];objs=objs.map(o=>{if(!sel.has(o))return o;const c=cl(o);m.push(c);return c});sel.clear();m.forEach(c=>sel.add(c));mv.c=true}
  const dx=x-mv.x,dy=y-mv.y;mv.x=x;mv.y=y;for(const o of sel)shift(o,dx,dy);inv(true,true)}
function selUp(){if(mode==='marq'){const[a,b,c,d]=marq,l=Math.min(a,c),r=Math.max(a,c),t=Math.min(b,d),bt=Math.max(b,d);sel.clear();if(r-l>4/S.s||bt-t>4/S.s)for(const o of objs){const q=bnd(o);if(q[2]>=l&&q[0]<=r&&q[3]>=t&&q[1]<=bt)sel.add(o)}marq=null}else save();selUI();inv(false,true)}
function editSel(fn){if(!sel.size)return;pushUndo();const m=[];objs=objs.map(o=>{if(!sel.has(o))return o;const c=cl(o);fn(c);m.push(c);return c});sel.clear();m.forEach(c=>sel.add(c));inv(true,true);save()}
function delSel(){if(!sel.size)return;pushUndo();objs=objs.filter(o=>!sel.has(o));sel.clear();selUI();inv(true,true);save()}
function dupSel(){if(!sel.size)return;pushUndo();const n=[];for(const o of sel){const c=cl(o);shift(c,24/S.s,24/S.s);objs.push(c);n.push(c)}sel.clear();n.forEach(c=>sel.add(c));selUI();inv(true,true);save()}
$('#sdup').onclick=dupSel;$('#sdel').onclick=delSel;
const recolor=()=>{if(S.tool==='select')editSel(o=>{o.c=S.color})};cols.addEventListener('click',recolor);cols.addEventListener('change',recolor);
$('#undo').addEventListener('click',clearSel);$('#redo').addEventListener('click',clearSel);
cvT.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;hov=toW(e);if(S.tool==='eraser')inv(false,true)});
cvT.addEventListener('pointerleave',()=>{hov=null;if(S.tool==='eraser')inv(false,true)});
chips('#erC',[['s','Whole stroke'],['p','Partial']],'erm');
$('#er').oninput=e=>{S.er=+e.target.value;save()};$('#fd').oninput=e=>{S.fade=+e.target.value;$('#fdv').textContent=S.fade+'s';save()};
{const _s=setTool;setTool=function(t){if(t!=='select')clearSel();_s(t);if(t==='laser')toast('Laser ink fades after '+S.fade+'s');if(t==='select')toast('Drag to select, then move')}}
addEventListener('keydown',e=>{if(document.activeElement===ti)return;const k=e.key.toLowerCase(),m=e.ctrlKey||e.metaKey;
  if((k==='delete'||k==='backspace')&&sel.size){e.preventDefault();delSel()}
  else if(m&&k==='d'){e.preventDefault();dupSel()}
  else if(m&&k==='a'){e.preventDefault();setTool('select');sel.clear();objs.forEach(o=>sel.add(o));selUI();inv(false,true)}
  else if(k==='escape')clearSel()});
/* ---------- keys & boot ---------- */
addEventListener('keydown',e=>{if(document.activeElement===ti)return;const k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&k==='z'){e.preventDefault();$(e.shiftKey?'#redo':'#undo').click();return}
  if((e.ctrlKey||e.metaKey)&&k==='y'){e.preventDefault();$('#redo').click();return}
  if(k===' '&&!space){space=true;cvT.style.cursor='grab';e.preventDefault();return}
  if(e.ctrlKey||e.metaKey||e.altKey)return;const t=TOOLS.find(x=>x[2]===k);if(t)setTool(t[0])});
addEventListener('keyup',e=>{if(e.key===' '){space=false;setTool(S.tool)}});
addEventListener('resize',resize);
setTool(S.tool);setColor(S.color);setBg(S.bg);pat();dot();zl();btns();$('#sz').value=S.size;ui2();resize();
</script></body></html>
